name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - name: Isolate the new-surface test batch per file
        # These files ship their first Linux run with 0.6.0. A hang inside the
        # combined node --test run names no file, so each one runs on its own
        # with a hard ceiling and the batch itself still runs under npm test.
        if: runner.os == 'Linux'
        run: |
          for f in relayClientDisconnect relayDispatchContract runtimeSupervisor \
            runtimeHistoryOrigin runtimeRecoveryStore runtimeLoopDetector \
            runtimeOutputSampler scheduledTaskRules scheduledTaskStore \
            scheduledTaskScheduler scheduledTaskCrashProcess scheduledTaskShutdownHttp \
            sshConnectionManager remoteTargetStore headlessCredentialVault \
            headlessVaultProcess deviceToolApproval deviceToolService deviceToolMcpIntegration; do
            echo "=== $f ==="
            timeout 120 node --test "./tests/$f.test.js" || { echo "TIMEOUT or FAIL: $f"; exit 1; }
          done
      - name: npm test
        run: npm test
        timeout-minutes: 15

  windows-smoke:
    # Pin Visual Studio 2022 so node-gyp can build native dependencies such
    # as better-sqlite3 when a prebuilt binary is unavailable.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - run: npm run test:completion
      - run: node ./tests/serviceCommand.test.js
      - run: node --test ./tests/localApiAuth.test.js ./tests/windowsServiceElevation.test.js ./tests/windowsServiceLifecycle.test.js ./tests/windowsInstallerCleanup.test.js
      - run: npm run test:update
      - run: node ./tests/spawnCommand.test.js
      - run: npm pack
      - shell: pwsh
        run: npm install --global (Get-ChildItem originrouter-*.tgz | Select-Object -First 1).FullName
      - run: originrouter --version
      - run: or --version
