<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc">
  <title id="title">OriginRouter 协作控制平面</title>
  <desc id="desc">团队管理、数据共享、内容接力和权限审核进入 OriginRouter CLI。CLI 运行 Claude Code、Codex 以及后续扩展的其他智能体，多模型路由根据数据区域选择云端、本地或远程模型服务，并支持跨区域自部署调度。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ef5a24"/></marker><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c8a84"/></marker><filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#27251f" flood-opacity="0.08"/></filter></defs>
  <rect width="1440" height="640" rx="28" fill="#f8f7f3"/><text x="70" y="42" fill="#8c8a84" font-family="Inter,ui-sans-serif,sans-serif" font-size="13" font-weight="600" letter-spacing="1.8">一个面向协作的控制平面</text>
  <g font-family="Inter,ui-sans-serif,sans-serif"><rect x="70" y="68" width="235" height="76" rx="15" fill="#fff" stroke="#dedbd3"/><circle cx="96" cy="98" r="7" fill="#ef5a24"/><text x="116" y="103" fill="#24231f" font-size="18" font-weight="700">团队管理</text><text x="96" y="126" fill="#8c8a84" font-size="12">协调成员与智能体</text></g><g font-family="Inter,ui-sans-serif,sans-serif"><rect x="325" y="68" width="235" height="76" rx="15" fill="#fff" stroke="#dedbd3"/><circle cx="351" cy="98" r="7" fill="#ef5a24"/><text x="371" y="103" fill="#24231f" font-size="18" font-weight="700">数据共享</text><text x="351" y="126" fill="#8c8a84" font-size="12">只共享任务所需的数据</text></g><g font-family="Inter,ui-sans-serif,sans-serif"><rect x="580" y="68" width="235" height="76" rx="15" fill="#fff" stroke="#dedbd3"/><circle cx="606" cy="98" r="7" fill="#ef5a24"/><text x="626" y="103" fill="#24231f" font-size="18" font-weight="700">内容接力</text><text x="606" y="126" fill="#8c8a84" font-size="12">在人员和设备之间交接工作</text></g><g font-family="Inter,ui-sans-serif,sans-serif"><rect x="835" y="68" width="235" height="76" rx="15" fill="#fff" stroke="#dedbd3"/><circle cx="861" cy="98" r="7" fill="#ef5a24"/><text x="881" y="103" fill="#24231f" font-size="18" font-weight="700">权限审核</text><text x="861" y="126" fill="#8c8a84" font-size="12">在本机批准敏感操作</text></g>
  <path d="M70 169H1070" stroke="#e7e4dc"/><path d="M600 145V188" stroke="#ef5a24" stroke-width="2.5" marker-end="url(#a)"/>
  <g filter="url(#s)" font-family="Inter,ui-sans-serif,sans-serif"><rect x="70" y="220" width="260" height="108" rx="18" fill="#fff" stroke="#dedbd3"/><circle cx="101" cy="253" r="9" fill="#ef5a24"/><text x="125" y="258" fill="#24231f" font-size="22" font-weight="700">OriginRouter App</text><text x="101" y="290" fill="#6d6a63" font-size="15">查看状态 · 审批 · 远程跟进</text><text x="101" y="311" fill="#9b9890" font-size="12">可选的可视化控制入口</text></g><g filter="url(#s)" font-family="Inter,ui-sans-serif,sans-serif"><rect x="430" y="200" width="340" height="148" rx="20" fill="#24231f"/><rect x="430" y="200" width="6" height="148" rx="3" fill="#ef5a24"/><text x="480" y="251" fill="#fff" font-size="28" font-weight="750">OriginRouter CLI</text><text x="480" y="285" fill="#d8d5ce" font-size="16">工作区 · 会话 · 审批策略</text><text x="480" y="313" fill="#a9a59d" font-size="13">命令和工具在这里执行</text></g><g font-family="Inter,ui-sans-serif,sans-serif"><rect x="870" y="200" width="230" height="148" rx="20" fill="#fff4ed" stroke="#ef5a24" stroke-width="1.5"/><circle cx="901" cy="236" r="9" fill="#ef5a24"/><text x="925" y="242" fill="#a84017" font-size="20" font-weight="700">推理资源调度</text><text x="901" y="279" fill="#6d6a63" font-size="14">多区域 · 多模型 · 多集群</text><text x="901" y="303" fill="#6d6a63" font-size="14">负载均衡与故障切换</text><text x="901" y="328" fill="#9b9890" font-size="12">按数据和策略分配请求</text></g><g filter="url(#s)" font-family="Inter,ui-sans-serif,sans-serif"><rect x="1170" y="200" width="200" height="148" rx="18" fill="#fff" stroke="#dedbd3"/><circle cx="1201" cy="236" r="9" fill="#24231f"/><text x="1225" y="242" fill="#24231f" font-size="21" font-weight="700">推理资源池</text><text x="1201" y="279" fill="#6d6a63" font-size="14">OriginRouter 云</text><text x="1201" y="303" fill="#6d6a63" font-size="14">本地节点 · 团队集群</text><text x="1201" y="327" fill="#9b9890" font-size="12">远程部署节点</text></g>
  <path d="M330 274H422" stroke="#ef5a24" stroke-width="2.5" marker-end="url(#a)"/><text x="376" y="260" text-anchor="middle" fill="#ef5a24" font-family="Inter,ui-sans-serif,sans-serif" font-size="12" font-weight="650">控制</text><path d="M778 274H862" stroke="#8c8a84" stroke-width="2" stroke-dasharray="6 7" marker-end="url(#m)"/><text x="820" y="260" text-anchor="middle" fill="#8c8a84" font-family="Inter,ui-sans-serif,sans-serif" font-size="12" font-weight="650">路由</text><path d="M1108 274H1162" stroke="#8c8a84" stroke-width="2" stroke-dasharray="6 7" marker-end="url(#m)"/>
  <path d="M600 348V404" stroke="#ef5a24" stroke-width="2.5"/><path d="M600 404H350V429" stroke="#ef5a24" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M600 404V429" stroke="#ef5a24" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M600 404H850V429" stroke="#b4afa6" stroke-width="2" stroke-dasharray="6 7" fill="none" marker-end="url(#m)"/>
  <g filter="url(#s)" font-family="Inter,ui-sans-serif,sans-serif"><rect x="235" y="430" width="230" height="92" rx="16" fill="#fff" stroke="#dedbd3"/><text x="268" y="475" fill="#24231f" font-size="21" font-weight="700">Claude Code</text><text x="268" y="500" fill="#8c8a84" font-size="13">原生执行引擎</text></g><g filter="url(#s)" font-family="Inter,ui-sans-serif,sans-serif"><rect x="485" y="430" width="230" height="92" rx="16" fill="#fff" stroke="#dedbd3"/><text x="518" y="475" fill="#24231f" font-size="21" font-weight="700">Codex</text><text x="518" y="500" fill="#8c8a84" font-size="13">原生执行引擎</text></g><g font-family="Inter,ui-sans-serif,sans-serif"><rect x="735" y="430" width="230" height="92" rx="16" fill="#fbfaf7" stroke="#c8c4ba" stroke-width="1.5" stroke-dasharray="7 6"/><text x="768" y="475" fill="#5f5c55" font-size="21" font-weight="700">更多智能体</text><text x="768" y="500" fill="#9b9890" font-size="13">持续扩展的运行入口</text></g>
  <text x="720" y="584" text-anchor="middle" fill="#6d6a63" font-family="Inter,ui-sans-serif,sans-serif" font-size="14">人员通过 App 协作，任务仍由 CLI 所在设备执行</text>
</svg>
